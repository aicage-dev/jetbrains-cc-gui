name: Build Plugin

on:
  push:
    branches: [ '**' ]
    tags: [ '**' ]
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      release-tag:
        description: Tag to create after a successful build
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.extract.outputs.artifact-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install webview dependencies
        working-directory: webview
        run: npm ci

      - name: Install ai-bridge dependencies
        working-directory: ai-bridge
        run: npm ci

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Locate plugin zip
        id: extract
        run: |
          ZIP_FILE=$(ls build/distributions/*.zip | head -n 1)
          ZIP_NAME=$(basename "$ZIP_FILE")
          echo "zip-file=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "artifact-name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.extract.outputs.zip-file }}
          if-no-files-found: error
          archive: false

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.release-tag != ''

    permissions:
      contents: write

    steps:
      - name: Checkout plugin repository template
        if: inputs.release-tag != ''
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
          skip-decompress: true

      - name: Create plugin repository metadata
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          ZIP_NAME: ${{ needs.build.outputs.artifact-name }}
        run: |
          export PLUGIN_VERSION=${RELEASE_TAG#v}
          export PLUGIN_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ZIP_NAME}"
          # envsubst expects literal variable names here.
          # shellcheck disable=SC2016
          envsubst '${PLUGIN_URL} ${PLUGIN_VERSION}' \
            < .github/updatePlugins.xml.template \
            > dist/updatePlugins.xml

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release-tag || github.ref_name }}
          target_commitish: ${{ inputs.ref || github.sha }}
          files: |
            dist/${{ needs.build.outputs.artifact-name }}
            ${{ inputs.release-tag != '' && 'dist/updatePlugins.xml' || '' }}
          generate_release_notes: true

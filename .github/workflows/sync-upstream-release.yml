name: Sync Upstream Release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: zhukunpenglinyutong/jetbrains-cc-gui
  PATCH_BRANCH: upstream-PR/01-add-Codex-CLI-path-override-in-settings
  RELEASE_SUFFIX: pr01codex

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.release.outputs.needed }}
      release-branch: ${{ steps.release.outputs.release-branch }}
      release-tag: ${{ steps.release.outputs.release-tag }}

    steps:
      - name: Read latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS=$'\t' read -r upstream_tag target < <(
            gh api "repos/$UPSTREAM_REPOSITORY/releases/latest" \
              --jq '[.tag_name, .target_commitish] | @tsv'
          )
          version=${upstream_tag#v}

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Unsupported upstream release tag: $upstream_tag" >&2
            exit 1
          fi

          release_tag="v${version}-${RELEASE_SUFFIX}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Fork release $release_tag already exists."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "needed=true"
            echo "upstream-tag=$upstream_tag"
            echo "upstream-target=$target"
            echo "version=$version"
            echo "release-tag=$release_tag"
            echo "release-branch=fork-release/$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout fork
        if: steps.release.outputs.needed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream and patch branch
        if: steps.release.outputs.needed == 'true'
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --prune upstream \
            '+refs/heads/*:refs/remotes/upstream/*' \
            '+refs/tags/*:refs/upstream/tags/*'
          git fetch origin \
            "+refs/heads/${PATCH_BRANCH}:refs/remotes/origin/${PATCH_BRANCH}"

      - name: Resolve upstream release source
        if: steps.release.outputs.needed == 'true'
        id: source
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream-tag }}
          UPSTREAM_TARGET: ${{ steps.release.outputs.upstream-target }}
          UPSTREAM_VERSION: ${{ steps.release.outputs.version }}
        run: |
          source_ref=''

          version_at_ref() {
            git show "$1:build.gradle" 2>/dev/null \
              | sed -nE "s/^version = ['\"]([^'\"]+)['\"]$/\1/p" \
              | head -n 1
          }

          consider_ref() {
            local candidate=$1
            if [[ -n "$source_ref" ]]; then
              return
            fi
            if git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null \
              && [[ "$(version_at_ref "$candidate")" == "$UPSTREAM_VERSION" ]]; then
              source_ref=$candidate
            fi
          }

          # Upstream commonly puts a release on feature/vX.Y.Z while its tag or
          # default branch may already point somewhere else.
          consider_ref "refs/remotes/upstream/feature/$UPSTREAM_TAG"
          consider_ref "refs/remotes/upstream/feature/v$UPSTREAM_VERSION"
          consider_ref "refs/remotes/upstream/release/$UPSTREAM_TAG"
          consider_ref "refs/remotes/upstream/release/v$UPSTREAM_VERSION"
          consider_ref "refs/remotes/upstream/$UPSTREAM_TARGET"
          consider_ref "refs/upstream/tags/$UPSTREAM_TAG"

          while IFS= read -r candidate; do
            if [[ "$candidate" == *"$UPSTREAM_VERSION"* ]]; then
              consider_ref "$candidate"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/upstream)

          if [[ -z "$source_ref" ]]; then
            echo "Could not find an upstream ref whose build.gradle version is $UPSTREAM_VERSION." >&2
            exit 1
          fi

          source_sha=$(git rev-parse "${source_ref}^{commit}")
          echo "Using $source_ref ($source_sha) for upstream $UPSTREAM_TAG."
          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Create upstream release branch
        if: steps.release.outputs.needed == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.release-branch }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          git switch --create "$RELEASE_BRANCH" "$SOURCE_REF"

      - name: Publish upstream release branch
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release-branch }}
        run: |
          gh auth setup-git
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

      - name: Merge fork patch
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release-branch }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merges" \
            -f base="${RELEASE_BRANCH}" \
            -f head="${PATCH_BRANCH}" \
            -f commit_message="Merge ${PATCH_BRANCH} into ${RELEASE_BRANCH}" \
            --jq '"Release branch now points to " + .sha'

      - name: Set fork plugin version
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release-branch }}
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
          UPSTREAM_VERSION: ${{ steps.release.outputs.version }}
        run: |
          fork_version=${RELEASE_TAG#v}
          gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/build.gradle" \
            -f ref="$RELEASE_BRANCH" \
            --jq .content \
            | base64 --decode > build.gradle

          expected="version = '$UPSTREAM_VERSION'"
          if [[ "$(grep -Fxc "$expected" build.gradle)" -ne 1 ]]; then
            echo "Expected exactly one build.gradle version line: $expected" >&2
            exit 1
          fi
          sed -i "s/^version = '$UPSTREAM_VERSION'$/version = '$fork_version'/" build.gradle

          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RELEASE_BRANCH}" --jq .object.sha)
          file_contents=$(base64 -w0 build.gradle)
          # GraphQL variables are supplied separately below.
          # shellcheck disable=SC2016
          query='mutation(
            $repository: String!,
            $branch: String!,
            $expectedHead: GitObjectID!,
            $message: String!,
            $contents: Base64String!
          ) {
            createCommitOnBranch(input: {
              branch: {
                repositoryNameWithOwner: $repository,
                branchName: $branch
              },
              expectedHeadOid: $expectedHead,
              message: { headline: $message },
              fileChanges: {
                additions: [{ path: "build.gradle", contents: $contents }]
              }
            }) { commit { oid } }
          }'
          gh api graphql \
            -f query="$query" \
            -f repository="$GITHUB_REPOSITORY" \
            -f branch="refs/heads/$RELEASE_BRANCH" \
            -f expectedHead="$head_sha" \
            -f message="chore(release): fork build $fork_version" \
            -f contents="$file_contents" \
            --jq '"Release branch now points to " + .data.createCommitOnBranch.commit.oid'

  build-and-release:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.release-branch }}
      release-tag: ${{ needs.prepare.outputs.release-tag }}
